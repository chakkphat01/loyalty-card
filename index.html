<!DOCTYPE html>
<html lang="th" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>สะสมแสตมป์</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&family=Prompt:wght@400;600;700;800&display=swap" rel="stylesheet" />

  <style>
    /* ── THEME TOKENS ── */
    :root[data-theme="dark"] {
      --bg:       #0f0f17;
      --surface:  #1a1a2e;
      --border:   rgba(255,255,255,0.09);
      --text:     #ffffff;
      --muted:    rgba(255,255,255,0.4);
      --faint:    rgba(255,255,255,0.12);
      --accent:   #f5c842;
      --card-color: #1a1a2e;
      --grid-line: rgba(255,255,255,.015);
      --numpad-bg: rgba(255,255,255,0.06);
      --numpad-border: rgba(255,255,255,0.1);
      --numpad-text: #fff;
      --numpad-active: rgba(255,255,255,0.15);
      --dot-border: rgba(255,255,255,0.25);
      --scrollbar: rgba(255,255,255,.15);
    }
    :root[data-theme="light"] {
      --bg:       #f5f3ef;
      --surface:  #ffffff;
      --border:   rgba(0,0,0,0.08);
      --text:     #1c1917;
      --muted:    rgba(0,0,0,0.4);
      --faint:    rgba(0,0,0,0.06);
      --accent:   #e6a800;
      --card-color: #ffffff;
      --grid-line: rgba(0,0,0,.03);
      --numpad-bg: #ffffff;
      --numpad-border: rgba(0,0,0,0.12);
      --numpad-text: #1c1917;
      --numpad-active: rgba(0,0,0,0.08);
      --dot-border: rgba(0,0,0,0.2);
      --scrollbar: rgba(0,0,0,.15);
    }

    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }

    body {
      font-family: 'Sarabun', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      overflow-x: hidden;
      transition: background .3s, color .3s;
    }
    h1,h2,.heading { font-family: 'Prompt', sans-serif; }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image:
        linear-gradient(var(--grid-line) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
      background-size: 32px 32px;
      pointer-events: none; z-index: 0;
      transition: background-image .3s;
    }
    .page { position: relative; z-index: 1; }

    /* ── THEME TOGGLE ── */
    .theme-btn {
      width: 40px; height: 40px;
      border-radius: 12px;
      background: var(--faint);
      border: 1px solid var(--border);
      color: var(--text);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: background .15s;
    }
    .theme-btn:active { background: var(--numpad-active); }

    /* ── NUMPAD ── */
    .numpad-btn {
      font-family: 'Prompt', sans-serif;
      font-weight: 600; font-size: 1.4rem;
      background: var(--numpad-bg);
      border: 1px solid var(--numpad-border);
      border-radius: 14px;
      color: var(--numpad-text);
      width: 100%; aspect-ratio: 1.2;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: background .12s, transform .1s;
      user-select: none;
    }
    .numpad-btn:active { background: var(--numpad-active); transform: scale(.94); }
    .numpad-btn.confirm { background: var(--accent); color: #0f0f17; border-color: transparent; }
    .numpad-btn.confirm:active { opacity: .85; }
    .numpad-btn.delete { background: rgba(255,60,60,0.12); border-color: rgba(255,60,60,.2); color: #ff6b6b; }

    /* ── PHONE DOTS ── */
    .phone-dots span {
      display: inline-block;
      width: 14px; height: 14px;
      border-radius: 50%;
      border: 2px solid var(--dot-border);
      margin: 0 4px;
      transition: background .2s, border-color .2s, transform .2s;
    }
    .phone-dots span.filled { background: var(--accent); border-color: var(--accent); transform: scale(1.15); }

    /* ── STAMP CARD ── */
    .stamp-card {
      background: var(--card-color);
      border-radius: 24px;
      position: relative; overflow: hidden;
      box-shadow: 0 0 0 1px var(--border), 0 20px 60px rgba(0,0,0,.25);
      transition: background .3s;
    }
    .stamp-card::before {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,.07) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }
    /* overlay สำหรับกรณีมี card image */
    .stamp-card-overlay {
      position: absolute; inset: 0;
      background: var(--card-overlay, none);
      pointer-events: none; z-index: 1; border-radius: 24px;
    }
    .stamp-card > * { position: relative; z-index: 2; }
    .stamp-card::after {
      content: '';
      position: absolute;
      top: -8px; left: 50%;
      transform: translateX(-50%);
      width: 60%; height: 16px;
      background: var(--bg);
      border-radius: 0 0 20px 20px;
      transition: background .3s;
    }

    /* ── STAMP SLOT ── */
    .stamp-slot {
      width: 52px; height: 52px;
      border-radius: 50%;
      border: 2px dashed rgba(255,255,255,.2);
      display: flex; align-items: center; justify-content: center;
      transition: all .3s cubic-bezier(.34,1.56,.64,1);
    }
    .stamp-slot.filled {
      border-style: solid; border-color: rgba(255,255,255,.25);
      background: rgba(255,255,255,.08); transform: scale(1.04);
    }
    .stamp-slot.filled svg { filter: drop-shadow(0 0 6px rgba(255,220,80,.5)); }

    /* ── PULSE BUTTON ── */
    @keyframes pulse-ring {
      0%   { transform: scale(1); opacity: .7; }
      70%  { transform: scale(1.18); opacity: 0; }
      100% { transform: scale(1.18); opacity: 0; }
    }
    .pulse-btn-wrap { position: relative; display: inline-block; width: 100%; }
    .pulse-ring { position: absolute; inset: 0; border-radius: 16px; animation: pulse-ring 1.8s ease-out infinite; }
    .pulse-btn {
      font-family: 'Prompt', sans-serif; font-weight: 700; font-size: 1.15rem;
      border-radius: 16px; width: 100%; padding: 18px 0;
      cursor: pointer; position: relative; z-index: 1;
      transition: transform .15s; border: none; outline: none;
    }
    .pulse-btn:active { transform: scale(.97); }

    /* ── SHIMMER ── */
    @keyframes shimmer {
      0% { background-position: -400px 0; }
      100% { background-position: 400px 0; }
    }
    .shimmer {
      background: linear-gradient(90deg, var(--faint) 25%, rgba(255,255,255,.1) 50%, var(--faint) 75%);
      background-size: 800px 100%; animation: shimmer 1.4s infinite; border-radius: 12px;
    }

    /* ── TOAST ── */
    @keyframes toast-in  { from { transform:translateX(-50%) translateY(24px) scale(.95); opacity:0; } to { transform:translateX(-50%) translateY(0) scale(1); opacity:1; } }
    @keyframes toast-out { from { transform:translateX(-50%) translateY(0) scale(1); opacity:1; } to { transform:translateX(-50%) translateY(24px) scale(.95); opacity:0; } }
    .toast {
      position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%);
      z-index: 999; font-size: .95rem;
      padding: 14px 24px; border-radius: 50px; white-space: nowrap;
      box-shadow: 0 8px 32px rgba(0,0,0,.4);
      animation: toast-in .3s cubic-bezier(.34,1.56,.64,1) forwards;
    }
    .toast.hiding { animation: toast-out .3s ease forwards; }

    /* ── FADE UP ── */
    @keyframes fadeUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
    .fade-up { animation: fadeUp .5s cubic-bezier(.22,1,.36,1) both; }
    .delay-1{animation-delay:.1s} .delay-2{animation-delay:.2s} .delay-3{animation-delay:.3s} .delay-4{animation-delay:.4s}

    /* ── TAB NAV ── */
    .tab-bar { display: flex; background: var(--faint); border-radius: 14px; padding: 4px; gap: 2px; }
    .tab-btn {
      flex: 1; font-family: 'Prompt', sans-serif; font-size: .82rem; font-weight: 600;
      padding: 9px 0; border-radius: 10px; border: none; cursor: pointer;
      transition: background .2s, color .2s;
      color: var(--muted); background: transparent;
    }
    .tab-btn.active { background: var(--surface); color: var(--text); box-shadow: 0 2px 8px rgba(0,0,0,.15); }

    /* ── HISTORY LIST ── */
    .history-row {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      transition: background .2s;
    }
    .history-row + .history-row { margin-top: 10px; }

    /* ── SCROLLBAR ── */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 4px; }

    /* ── MODAL BACKDROP ── */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,.6);
      z-index: 800; display: flex; align-items: flex-end; justify-content: center;
      backdrop-filter: blur(4px);
    }
    .modal-sheet {
      background: var(--surface); width: 100%; max-width: 420px;
      border-radius: 24px 24px 0 0; padding: 24px 20px 40px;
      max-height: 80dvh; overflow-y: auto;
    }
    @keyframes sheetUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .modal-sheet { animation: sheetUp .3s cubic-bezier(.34,1.56,.64,1); }
  </style>
</head>
<body>

<!-- ══════════ ERROR ══════════ -->
<div id="error-page" class="page hidden min-h-dvh flex flex-col items-center justify-center px-6 text-center">
  <div class="text-5xl mb-4">⚠️</div>
  <h2 class="heading text-xl font-bold mb-2">ไม่พบข้อมูลร้านค้า</h2>
  <p style="color:var(--muted)" class="text-sm leading-relaxed">ลิงก์ไม่ถูกต้องหรือหมดอายุแล้ว<br/>กรุณาสแกน QR Code ใหม่อีกครั้ง</p>
</div>

<!-- ══════════ LOGIN ══════════ -->
<div id="login-page" class="page hidden min-h-dvh flex flex-col px-5 py-8" style="max-width:420px;margin:auto;">

  <!-- Theme toggle -->
  <div class="flex justify-end mb-2">
    <button class="theme-btn" onclick="toggleTheme()" title="เปลี่ยนธีม" id="theme-icon-login">🌙</button>
  </div>

  <div class="fade-up mb-8 text-center pt-2">
    <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl mb-4" style="background:var(--faint);border:1px solid var(--border)">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
        <path d="M12 2C6.477 2 2 6.477 2 12s4.477 10 10 10 10-4.477 10-10S17.523 2 12 2z" fill="rgba(245,200,66,.15)" stroke="#f5c842" stroke-width="1.5"/>
        <path d="M8 12l3 3 5-5" stroke="#f5c842" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h1 class="heading text-2xl font-bold">สะสมแสตมป์</h1>
    <p style="color:var(--muted)" class="text-sm mt-1">กรอกเบอร์โทรเพื่อเริ่มสะสมแต้ม</p>
  </div>

  <!-- Phone display -->
  <div class="fade-up delay-1 mb-6 text-center">
    <div class="inline-block rounded-2xl px-6 py-4 min-w-[200px]" style="background:var(--faint);border:1px solid var(--border)">
      <div id="phone-display" class="heading text-3xl font-bold tracking-widest mb-3 min-h-[40px]" style="color:var(--muted)"></div>
      <div class="phone-dots" id="phone-dots">
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span>
      </div>
    </div>
  </div>

  <!-- Numpad -->
  <div class="fade-up delay-2 flex-1">
    <div class="grid grid-cols-3 gap-3 mb-3">
      <button class="numpad-btn" onclick="numpadPress('1')">1</button>
      <button class="numpad-btn" onclick="numpadPress('2')">2</button>
      <button class="numpad-btn" onclick="numpadPress('3')">3</button>
      <button class="numpad-btn" onclick="numpadPress('4')">4</button>
      <button class="numpad-btn" onclick="numpadPress('5')">5</button>
      <button class="numpad-btn" onclick="numpadPress('6')">6</button>
      <button class="numpad-btn" onclick="numpadPress('7')">7</button>
      <button class="numpad-btn" onclick="numpadPress('8')">8</button>
      <button class="numpad-btn" onclick="numpadPress('9')">9</button>
      <button class="numpad-btn delete" onclick="numpadDelete()">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <path d="M21 5H7l-4 7 4 7h14V5z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          <path d="M14 9l-4 6M10 9l4 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </button>
      <button class="numpad-btn" onclick="numpadPress('0')">0</button>
      <button class="numpad-btn confirm" onclick="numpadConfirm()" id="confirm-btn">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <path d="M5 12l5 5L19 7" stroke="#0f0f17" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
    <p class="text-center text-xs mt-4 leading-relaxed" style="color:var(--muted)">
      เบอร์โทรของคุณจะถูกเก็บเฉพาะในอุปกรณ์นี้<br/>เพื่อความสะดวกในการใช้งาน
    </p>
  </div>
</div>

<!-- ══════════ MAIN CARD PAGE ══════════ -->
<div id="card-page" class="page hidden min-h-dvh flex flex-col px-4 py-6" style="max-width:420px;margin:auto;">

  <!-- Top bar -->
  <div class="fade-up flex items-center justify-between mb-5">
    <div>
      <p class="text-xs mb-0.5" style="color:var(--muted)">สวัสดีคุณ</p>
      <p class="heading font-bold text-base" id="display-phone">—</p>
    </div>
    <div class="flex items-center gap-2">
      <button class="theme-btn" onclick="toggleTheme()" id="theme-icon-card">🌙</button>
      <button onclick="logout()" class="theme-btn" title="เปลี่ยนเบอร์">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- TAB BAR -->
  <div class="fade-up delay-1 tab-bar mb-5">
    <button class="tab-btn active" id="tab-stamp" onclick="switchTab('stamp')">🎯 แสตมป์</button>
    <button class="tab-btn" id="tab-history" onclick="switchTab('history')">📋 ประวัติร้าน</button>
  </div>

  <!-- ══ TAB: STAMP ══ -->
  <div id="pane-stamp">
    <!-- Reward text -->
    <div class="fade-up delay-2 mb-4 text-center">
      <p id="reward-text" class="text-sm leading-relaxed" style="color:var(--muted)">
        <span class="shimmer inline-block w-40 h-4 rounded"></span>
      </p>
    </div>

    <!-- Stamp Card -->
    <div class="fade-up delay-2 stamp-card p-6 mb-4" id="stamp-card">
      <div class="stamp-card-overlay"></div>
      <div class="mb-5 pt-2">
        <div id="shop-name-display" class="heading font-bold text-xl shimmer h-6 w-32 rounded mb-1"></div>
        <div id="plan-badge" class="shimmer h-4 w-16 rounded"></div>
      </div>
      <div id="stamp-grid" class="grid grid-cols-5 gap-3 justify-items-center mb-2"></div>
      <div class="mt-5 pt-4 flex items-center justify-between" style="border-top:1px solid var(--border)">
        <span class="text-xs" style="color:var(--muted)">แต้มสะสม</span>
        <div class="flex items-baseline gap-1">
          <span id="points-count" class="heading font-bold text-2xl">—</span>
          <span id="max-points-display" class="text-sm font-medium" style="color:var(--muted)">/ —</span>
        </div>
      </div>
    </div>

    <!-- Action area -->
    <div class="fade-up delay-3" id="action-area">
      <div class="shimmer h-16 rounded-2xl"></div>
    </div>
  </div>

  <!-- ══ TAB: HISTORY ══ -->
  <div id="pane-history" class="hidden">
    <div id="history-loading" class="text-center py-12" style="color:var(--muted)">
      <div class="text-3xl mb-3">⏳</div>
      <p class="text-sm">กำลังโหลดข้อมูล...</p>
    </div>
    <div id="history-list" class="hidden"></div>
    <div id="history-empty" class="hidden text-center py-12" style="color:var(--muted)">
      <div class="text-3xl mb-3">📭</div>
      <p class="text-sm">ยังไม่มีประวัติการสะสม</p>
    </div>
  </div>

  <!-- Footer -->
  <div class="fade-up delay-4 text-center mt-6">
    <p class="text-xs" style="color:var(--faint)">Powered by StampX</p>
  </div>
</div>

<!-- ══════════ HISTORY DETAIL MODAL ══════════ -->
<div id="detail-modal" class="hidden modal-backdrop" onclick="closeModal(event)">
  <div class="modal-sheet" onclick="event.stopPropagation()">
    <div class="flex items-center justify-between mb-5">
      <h3 class="heading font-bold text-lg" id="modal-shop-name">—</h3>
      <button onclick="document.getElementById('detail-modal').classList.add('hidden')" class="theme-btn">✕</button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>

<script>
// ════════════════════════════════════════════════
//  CONFIG — เปลี่ยน URL นี้เป็น GAS Web App URL
// ════════════════════════════════════════════════
const GAS_URL = 'https://script.google.com/macros/s/AKfycby-5p7TDLgkMw8UIfs5DAjfQAnYgiDPFD0IYDI29qftVglxyKsOL9ORj8PdXMZ1N5yx/exec';

// ── RATE LIMIT (client-side guard) ──
const REQUEST_COOLDOWN_MS = 30000; // 30 วินาที
let lastRequestTime = 0;

// ── STATE ──
let shopId = null, userPhone = null, phoneBuffer = '', shopData = null, requesting = false;
let historyLoaded = false;
let currentTab = 'stamp';

// ── THEME ──
function getTheme() { return localStorage.getItem('theme') || 'dark'; }
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  const icon = t === 'dark' ? '🌙' : '☀️';
  document.querySelectorAll('#theme-icon-login, #theme-icon-card').forEach(b => b.textContent = icon);
  localStorage.setItem('theme', t);
}
function toggleTheme() { applyTheme(getTheme() === 'dark' ? 'light' : 'dark'); }

// ── INIT ──
function init() {
  applyTheme(getTheme());
  const params = new URLSearchParams(window.location.search);
  const rawShop = params.get('shop') || '';
  // ★ รองรับทั้ง ShopID ตรงๆ (S001) และ slug ที่ encode แล้ว (0sX3kp)
  // ถ้า slug มีแต่ตัวเลขเล็กหรือเลข ให้ decode ก่อน ไม่งั้นใช้ตรง
  shopId = rawShop.match(/^[0-9a-z]{6,}$/) ? decodeSlug(rawShop) : rawShop;
  if (!shopId) { showPage('error-page'); return; }

  userPhone = localStorage.getItem('userPhone');
  if (!userPhone) { showPage('login-page'); }
  else {
    showPage('card-page');
    document.getElementById('display-phone').textContent = formatPhone(userPhone);
    loadCardData();
  }
}

// ── PAGE ──
function showPage(id) {
  ['error-page','login-page','card-page'].forEach(p =>
    document.getElementById(p).classList.toggle('hidden', p !== id));
}

// ── TAB ──
function switchTab(tab) {
  currentTab = tab;
  document.getElementById('tab-stamp').classList.toggle('active', tab === 'stamp');
  document.getElementById('tab-history').classList.toggle('active', tab === 'history');
  document.getElementById('pane-stamp').classList.toggle('hidden', tab !== 'stamp');
  document.getElementById('pane-history').classList.toggle('hidden', tab !== 'history');
  if (tab === 'history' && !historyLoaded) loadHistory();
}

// ── NUMPAD ──
function numpadPress(d) { if (phoneBuffer.length >= 10) return; phoneBuffer += d; updatePhoneDisplay(); }
function numpadDelete() { phoneBuffer = phoneBuffer.slice(0,-1); updatePhoneDisplay(); }
function updatePhoneDisplay() {
  const el = document.getElementById('phone-display');
  const masked = phoneBuffer.padEnd(10,'·');
  el.textContent = masked.replace(/(.{3})(.{3})(.{4})/, '$1-$2-$3');
  el.style.color = phoneBuffer.length > 0 ? 'var(--text)' : 'var(--muted)';
  document.querySelectorAll('.phone-dots span').forEach((d,i) => d.classList.toggle('filled', i < phoneBuffer.length));
}
function numpadConfirm() {
  if (phoneBuffer.length !== 10) { showToast('⚠️ กรุณากรอกเบอร์โทร 10 หลัก','#ff6b6b'); return; }
  userPhone = phoneBuffer;
  localStorage.setItem('userPhone', userPhone);
  document.getElementById('display-phone').textContent = formatPhone(userPhone);
  showPage('card-page');
  loadCardData();
}

// ── LOAD CARD ──
async function loadCardData() {
  try {
    const data = await apiPost({ action:'check_points', shopId, phone:userPhone });
    if (!data.success) throw new Error(data.error || 'โหลดข้อมูลไม่สำเร็จ');
    renderCard(data);
  } catch(err) {
    showToast('⚠️ ' + err.message, '#ff6b6b');
  }
}

// ── RENDER CARD ──
function renderCard(data) {
  const { shop, customer } = data;
  shopData = shop;
  // เก็บ stampImageUrl ด้วย (column 7 ใน Shops sheet)
  shopData.stampImageUrl = shop.stampImageUrl || shop.cardImageUrl || '';
  const currentPoints = customer.currentPoints;
  const maxPoints     = shop.maxPoints;
  const remaining     = Math.max(0, maxPoints - currentPoints);

  const rawColor = (shop.cardColor||'').replace(/^#+/,'');
  const cardColor = rawColor ? '#'+rawColor : 'var(--surface)';
  document.documentElement.style.setProperty('--card-color', cardColor);

  // ★ Card Image URL (จาก Canva/Imgur)
  const cardEl = document.getElementById('stamp-card');
  const imgUrl = shop.cardImageUrl || '';
  if (imgUrl) {
    cardEl.style.backgroundImage = `url('${imgUrl}')`;
    cardEl.style.backgroundSize  = 'cover';
    cardEl.style.backgroundPosition = 'center';
    // overlay เพื่อให้อ่านตัวหนังสือได้
    cardEl.style.setProperty('--card-overlay','rgba(0,0,0,0.45)');
  } else {
    cardEl.style.backgroundImage = '';
    cardEl.style.setProperty('--card-overlay','none');
  }

  const rewardEl = document.getElementById('reward-text');
  // ★ ใช้ rewardText จาก Shops sheet (คอลัมน์ I) ถ้าไม่มีใช้ค่าเริ่มต้น
  const rewardLabel = shop.rewardText && shop.rewardText.trim()
    ? shop.rewardText.trim()
    : 'แลกฟรีได้เลย';
  if (remaining === 0) {
    rewardEl.innerHTML = `🎉 <span style="color:var(--text);font-weight:600">ครบแล้ว! กด${rewardLabel} ↓</span>`;
  } else {
    rewardEl.innerHTML = `อีก <span style="color:var(--text);font-weight:600">${remaining} แต้ม</span> ${rewardLabel}!`;
  }

  const nameEl = document.getElementById('shop-name-display');
  nameEl.textContent = shop.name || shop.shopName || `ร้านค้า #${shopId}`;
  nameEl.className = 'heading font-bold text-xl';

  const planColors = { S:'background:rgba(150,150,150,.2);color:#aaa', M:'background:rgba(59,130,246,.2);color:#93c5fd', L:'background:rgba(245,158,11,.2);color:#fcd34d' };
  const badge = document.getElementById('plan-badge');
  badge.setAttribute('style', `display:inline-block;font-size:.7rem;font-weight:600;padding:2px 8px;border-radius:50px;${planColors[shop.planType]||'background:rgba(255,255,255,.1);color:#ccc'}`);
  badge.textContent = `PLAN ${shop.planType}`;

  document.getElementById('points-count').textContent = currentPoints;
  document.getElementById('max-points-display').textContent = `/ ${maxPoints}`;
  renderStampGrid(currentPoints, maxPoints);
  renderActionArea(shop.canRequestPoints, shop.planType, currentPoints, maxPoints);
}

// ── STAMP GRID ──
function renderStampGrid(current, max) {
  const grid = document.getElementById('stamp-grid');
  grid.innerHTML = '';
  const imgUrl = shopData?.stampImageUrl || shopData?.cardImageUrl || '';
  for (let i = 0; i < max; i++) {
    const slot = document.createElement('div');
    const filled = i < current;
    slot.className = `stamp-slot ${filled ? 'filled' : ''}`;
    if (filled) {
      slot.innerHTML = imgUrl ? stampImgHTML(imgUrl) : stampSVG();
    } else {
      slot.innerHTML = `<span style="color:rgba(255,255,255,.2);font-size:.75rem;font-family:'Prompt',sans-serif">${i+1}</span>`;
    }
    slot.style.opacity = '0';
    slot.style.transform = 'scale(.5)';
    slot.style.transition = `opacity .3s ease ${i*40}ms, transform .4s cubic-bezier(.34,1.56,.64,1) ${i*40}ms`;
    grid.appendChild(slot);
    requestAnimationFrame(() => requestAnimationFrame(() => {
      slot.style.opacity = '1';
      slot.style.transform = filled ? 'scale(1.04)' : 'scale(1)';
    }));
  }
}
function stampImgHTML(url) {
  return `<img src="${url}" style="width:36px;height:36px;border-radius:50%;object-fit:cover;box-shadow:0 0 8px rgba(255,220,80,.5)" onerror="this.outerHTML=stampSVGStr()"/>`;
}
function stampSVGStr() {
  return `<svg width="26" height="26" viewBox="0 0 24 24" fill="none">
    <circle cx="12" cy="12" r="10" fill="rgba(245,200,66,.2)" stroke="#f5c842" stroke-width="1.5"/>
    <path d="M12 6l1.6 3.4 3.6.5-2.6 2.6.6 3.7L12 14.5l-3.2 1.7.6-3.7L6.8 9.9l3.6-.5z"
      fill="#f5c842" stroke="#f5c842" stroke-width=".5" stroke-linejoin="round"/>
  </svg>`;
}
function stampSVG() { return stampSVGStr(); }

// ── ACTION AREA ──
// รับ currentPoints, maxPoints ตรงๆ ไม่ parse DOM
function renderActionArea(canRequest, planType, currentPoints, maxPoints) {
  const area   = document.getElementById('action-area');
  const isFull = currentPoints >= maxPoints;

  // ★ แต้มเต็ม → แสดงปุ่มแลกรางวัล (ซ่อนปุ่มขอแต้มทั้งหมด)
  if (isFull) {
    area.innerHTML = `
      <div class="pulse-btn-wrap">
        <div class="pulse-ring" style="background:rgba(34,197,94,.35)"></div>
        <button class="pulse-btn" id="redeem-btn" style="background:#22c55e;color:#fff" onclick="redeemPoint()">
          🎁 กดแลกรางวัล
        </button>
      </div>
      <p class="text-center text-xs mt-3" style="color:var(--muted)">
        แตะเพื่อส่งคำขอแลกรางวัล — รอพนักงานอนุมัติ
      </p>
      <div class="mt-3 rounded-2xl px-4 py-3 text-center text-sm" style="background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.2);color:#16a34a">
        🎉 สะสมครบ ${maxPoints} แต้มแล้ว!
        ${currentPoints > maxPoints ? `<br/><span style="font-size:.75rem;opacity:.7">มีแต้มส่วนเกิน ${currentPoints - maxPoints} แต้ม จะคงอยู่หลังแลก</span>` : ''}
      </div>`;
    return;
  }

  if (!canRequest) {
    area.innerHTML = `
      <div class="flex items-start gap-3 rounded-2xl p-4" style="background:var(--faint);border:1px solid var(--border)">
        <span class="text-xl mt-0.5">📢</span>
        <p class="text-sm leading-relaxed" style="color:var(--muted)">กรุณาแจ้งเบอร์โทรศัพท์กับพนักงานหน้าร้านเพื่อสะสมแสตมป์</p>
      </div>`;
  } else {
    const _rb = (shopData?.cardColor||'').replace(/^#+/,'');
    const btnBg = _rb ? lighten('#'+_rb) : '#f5c842';
    area.innerHTML = `
      <div class="pulse-btn-wrap">
        <div class="pulse-ring" style="background:${btnBg}55"></div>
        <button class="pulse-btn" id="request-btn" style="background:${btnBg};color:#0f0f17" onclick="requestPoint()">
          ✦ กดขอรับแสตมป์
        </button>
      </div>
      <p class="text-center text-xs mt-3" style="color:var(--muted)">แตะเพื่อส่งคำขอให้พนักงานอนุมัติ</p>`;
  }
}

// ── REQUEST POINT (with cooldown) ──
async function requestPoint() {
  if (requesting) return;
  const now = Date.now();
  if (now - lastRequestTime < REQUEST_COOLDOWN_MS) {
    const sec = Math.ceil((REQUEST_COOLDOWN_MS - (now - lastRequestTime)) / 1000);
    showToast(`⏱ กรุณารอ ${sec} วินาทีก่อนกดใหม่`, '#f59e0b'); return;
  }
  requesting = true;
  lastRequestTime = now;
  const btn = document.getElementById('request-btn');
  if (btn) { btn.textContent = '⏳ กำลังส่ง...'; btn.disabled = true; }
  try {
    const data = await apiPost({ action:'request_point', shopId, phone:userPhone });
    if (!data.success) {
      showToast(data.error === 'COOLDOWN' ? '⏱ กรุณารอสักครู่ก่อนกดใหม่' : '⚠️ ' + (data.message || data.error), '#f59e0b');
    } else {
      showToast('✅ ส่งคำขอสำเร็จ รอพนักงานอนุมัติ', '#22c55e');
    }
  } catch(err) {
    showToast('⚠️ ส่งคำขอไม่สำเร็จ: ' + err.message, '#ff6b6b');
  } finally {
    requesting = false;
    if (btn) { btn.textContent = '✦ กดขอรับแสตมป์'; btn.disabled = false; }
  }
}

// ── HISTORY ──
async function loadHistory() {
  document.getElementById('history-loading').classList.remove('hidden');
  document.getElementById('history-list').classList.add('hidden');
  document.getElementById('history-empty').classList.add('hidden');
  try {
    const data = await apiPost({ action:'get_customer_history', phone:userPhone });
    historyLoaded = true;
    document.getElementById('history-loading').classList.add('hidden');
    if (!data.success || !data.shops || data.shops.length === 0) {
      document.getElementById('history-empty').classList.remove('hidden'); return;
    }
    renderHistory(data.shops);
  } catch(err) {
    document.getElementById('history-loading').classList.add('hidden');
    document.getElementById('history-empty').classList.remove('hidden');
    showToast('⚠️ โหลดประวัติไม่สำเร็จ', '#ff6b6b');
  }
}

function renderHistory(shops) {
  const list = document.getElementById('history-list');
  list.innerHTML = '';
  shops.forEach(s => {
    const pct = Math.min(100, Math.round((s.currentPoints / s.maxPoints) * 100));
    const div = document.createElement('div');
    div.className = 'history-row';
    div.innerHTML = `
      <div class="flex items-center justify-between mb-2">
        <div>
          <p class="font-bold text-sm">${s.shopName}</p>
          <p class="text-xs" style="color:var(--muted)">ล่าสุด: ${s.lastVisit || '—'}</p>
        </div>
        <div class="text-right">
          <p class="heading font-bold text-lg">${s.currentPoints}<span class="text-xs font-normal" style="color:var(--muted)"> / ${s.maxPoints}</span></p>
          <p class="text-xs" style="color:var(--muted)">แต้ม</p>
        </div>
      </div>
      <div style="background:var(--faint);border-radius:99px;height:6px;overflow:hidden">
        <div style="background:var(--accent);height:100%;width:${pct}%;border-radius:99px;transition:width .5s ease"></div>
      </div>
      ${s.totalVisits ? `<p class="text-xs mt-2" style="color:var(--muted)">มาแล้ว ${s.totalVisits} ครั้ง</p>` : ''}
    `;
    div.onclick = () => showShopDetail(s);
    list.appendChild(div);
  });
  list.classList.remove('hidden');
}

function showShopDetail(s) {
  document.getElementById('modal-shop-name').textContent = s.shopName;
  const body = document.getElementById('modal-body');
  const rows = (s.logs || []).map(l =>
    `<div class="flex justify-between py-2" style="border-bottom:1px solid var(--border)">
      <span class="text-sm" style="color:var(--muted)">${l.date}</span>
      <span class="font-bold text-sm">+${l.points} แต้ม</span>
    </div>`
  ).join('');
  body.innerHTML = `
    <div class="rounded-2xl p-4 mb-4 text-center" style="background:var(--faint)">
      <p class="heading text-3xl font-bold">${s.currentPoints} <span class="text-base font-normal" style="color:var(--muted)">/ ${s.maxPoints}</span></p>
      <p class="text-xs mt-1" style="color:var(--muted)">แต้มสะสม</p>
    </div>
    <p class="text-xs font-semibold uppercase tracking-widest mb-3" style="color:var(--muted)">ประวัติการรับแต้ม</p>
    ${rows || '<p class="text-sm text-center py-4" style="color:var(--muted)">ไม่มีข้อมูล</p>'}
  `;
  document.getElementById('detail-modal').classList.remove('hidden');
}
function closeModal(e) {
  if (e.target === document.getElementById('detail-modal'))
    document.getElementById('detail-modal').classList.add('hidden');
}

// ★ REDEEM POINT
async function redeemPoint() {
  if (requesting) return;
  requesting = true;
  const btn = document.getElementById('redeem-btn');
  if (btn) { btn.textContent='⏳ กำลังส่ง...'; btn.disabled=true; }
  try {
    const data = await apiPost({action:'redeem_request', shopId, phone:userPhone});
    if (!data.success) {
      showToast('⚠️ '+(data.error||'เกิดข้อผิดพลาด'), '#ff6b6b');
    } else {
      showToast('🎁 ส่งคำขอแลกรางวัลแล้ว รอพนักงานอนุมัติ', '#22c55e');
    }
  } catch(err) {
    showToast('⚠️ '+err.message, '#ff6b6b');
  } finally {
    requesting=false;
    if(btn){btn.textContent='🎁 กดแลกรางวัล';btn.disabled=false;}
  }
}

// ── LOGOUT ──
function logout() {
  if (!confirm('ต้องการเปลี่ยนเบอร์โทรใช่ไหม?')) return;
  localStorage.removeItem('userPhone');
  userPhone = null; phoneBuffer = ''; historyLoaded = false; currentTab = 'stamp';
  updatePhoneDisplay();
  switchTab('stamp');
  showPage('login-page');
}

// ── TOAST ──
function showToast(msg, bg='#333') {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div');
  t.className = 'toast';
  t.style.background = bg; t.style.color = '#fff';
  t.textContent = msg; document.body.appendChild(t);
  setTimeout(() => { t.classList.add('hiding'); setTimeout(() => t.remove(), 300); }, 3000);
}

// ── UTILS ──
function formatPhone(p) { return p.replace(/(\d{3})(\d{3})(\d{4})/, '$1-$2-$3'); }
function lighten(hex) {
  try {
    const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
    return (0.299*r + 0.587*g + 0.114*b) < 80 ? '#f5c842' : hex;
  } catch { return '#f5c842'; }
}


// ★ SLUG decode (ต้องตรงกับ SLUG_KEY ใน GAS)
const SLUG_KEY_JS = 31337;
const B62_JS = '0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ';
function decodeSlug(slug) {
  let n=0;
  for(let i=0;i<slug.length;i++) n=n*62+B62_JS.indexOf(slug[i]);
  n = n ^ SLUG_KEY_JS;
  let s='';
  while(n>0){ s=String.fromCharCode(n%128)+s; n=Math.floor(n/128); }
  return s;
}

// ════════════════════════════════════════════════
//  apiPost — JSONP (ไม่มี CORS กับ GAS)
// ════════════════════════════════════════════════
function apiPost(body) {
  return new Promise((resolve, reject) => {
    // Client-side token: ป้องกัน spam
    const token = btoa(body.phone || '').slice(0,8);
    const cbName = 'gcb_' + Date.now() + '_' + Math.floor(Math.random()*9999);
    const script = document.createElement('script');
    const timer = setTimeout(() => { cleanup(); reject(new Error('Timeout')); }, 15000);
    function cleanup() { clearTimeout(timer); delete window[cbName]; script.parentNode?.removeChild(script); }
    window[cbName] = (data) => { cleanup(); resolve(data); };
    script.onerror = () => { cleanup(); reject(new Error('Network error')); };
    const encoded = encodeURIComponent(JSON.stringify({ ...body, _t: token }));
    script.src = GAS_URL + '?callback=' + cbName + '&data=' + encoded;
    document.head.appendChild(script);
  });
}
