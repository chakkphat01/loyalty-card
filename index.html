<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>สะสมแสตมป์</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&family=Prompt:wght@400;600;700;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --card-color: #1a1a2e;
      --accent: #f5c842;
    }

    * { -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Sarabun', sans-serif;
      background: #0f0f17;
      min-height: 100dvh;
      overflow-x: hidden;
    }

    h1, h2, .heading { font-family: 'Prompt', sans-serif; }

    /* Background grid texture */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.015) 1px, transparent 1px);
      background-size: 32px 32px;
      pointer-events: none;
      z-index: 0;
    }

    .page { position: relative; z-index: 1; }

    /* ===== NUMPAD ===== */
    .numpad-btn {
      font-family: 'Prompt', sans-serif;
      font-weight: 600;
      font-size: 1.4rem;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      color: #fff;
      width: 100%;
      aspect-ratio: 1.2;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: background .12s, transform .1s;
      user-select: none;
    }
    .numpad-btn:active { background: rgba(255,255,255,0.15); transform: scale(.94); }
    .numpad-btn.confirm {
      background: var(--accent);
      color: #0f0f17;
      border-color: transparent;
    }
    .numpad-btn.confirm:active { opacity: .85; }
    .numpad-btn.delete { background: rgba(255,60,60,0.12); border-color: rgba(255,60,60,.2); color: #ff6b6b; }

    /* ===== PHONE DISPLAY ===== */
    .phone-dots span {
      display: inline-block;
      width: 14px; height: 14px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.25);
      margin: 0 4px;
      transition: background .2s, border-color .2s, transform .2s;
    }
    .phone-dots span.filled {
      background: var(--accent);
      border-color: var(--accent);
      transform: scale(1.15);
    }

    /* ===== STAMP CARD ===== */
    .stamp-card {
      background: var(--card-color);
      border-radius: 24px;
      position: relative;
      overflow: hidden;
      box-shadow:
        0 0 0 1px rgba(255,255,255,.08),
        0 20px 60px rgba(0,0,0,.5);
    }
    .stamp-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,.07) 0%, transparent 60%);
      pointer-events: none;
    }

    /* Stamp hole dots (decorative) */
    .stamp-card::after {
      content: '';
      position: absolute;
      top: -8px; left: 50%;
      transform: translateX(-50%);
      width: 60%;
      height: 16px;
      background: #0f0f17;
      border-radius: 0 0 20px 20px;
    }

    /* ===== STAMP SLOT ===== */
    .stamp-slot {
      width: 52px; height: 52px;
      border-radius: 50%;
      border: 2px dashed rgba(255,255,255,.2);
      display: flex; align-items: center; justify-content: center;
      transition: all .3s cubic-bezier(.34,1.56,.64,1);
      position: relative;
    }
    .stamp-slot.filled {
      border-style: solid;
      border-color: rgba(255,255,255,.25);
      background: rgba(255,255,255,.08);
      transform: scale(1.04);
    }
    .stamp-slot.filled svg { filter: drop-shadow(0 0 6px rgba(255,220,80,.5)); }

    /* ===== PULSE BUTTON ===== */
    @keyframes pulse-ring {
      0%   { transform: scale(1); opacity: .7; }
      70%  { transform: scale(1.18); opacity: 0; }
      100% { transform: scale(1.18); opacity: 0; }
    }
    .pulse-btn-wrap { position: relative; display: inline-block; width: 100%; }
    .pulse-ring {
      position: absolute;
      inset: 0;
      border-radius: 16px;
      animation: pulse-ring 1.8s ease-out infinite;
    }
    .pulse-btn {
      font-family: 'Prompt', sans-serif;
      font-weight: 700;
      font-size: 1.15rem;
      letter-spacing: .01em;
      border-radius: 16px;
      width: 100%;
      padding: 18px 0;
      cursor: pointer;
      position: relative;
      z-index: 1;
      transition: transform .15s, box-shadow .15s;
      border: none;
      outline: none;
    }
    .pulse-btn:active { transform: scale(.97); }

    /* ===== SHIMMER LOADER ===== */
    @keyframes shimmer {
      0%   { background-position: -400px 0; }
      100% { background-position: 400px 0; }
    }
    .shimmer {
      background: linear-gradient(90deg, rgba(255,255,255,.04) 25%, rgba(255,255,255,.1) 50%, rgba(255,255,255,.04) 75%);
      background-size: 800px 100%;
      animation: shimmer 1.4s infinite;
      border-radius: 12px;
    }

    /* ===== TOAST ===== */
    @keyframes toast-in { from { transform: translateY(24px) scale(.95); opacity: 0; } to { transform: translateY(0) scale(1); opacity: 1; } }
    @keyframes toast-out { from { transform: translateY(0) scale(1); opacity: 1; } to { transform: translateY(24px) scale(.95); opacity: 0; } }
    .toast {
      position: fixed;
      bottom: 32px; left: 50%;
      transform: translateX(-50%);
      z-index: 999;
      font-family: 'Sarabun', sans-serif;
      font-size: .95rem;
      padding: 14px 24px;
      border-radius: 50px;
      white-space: nowrap;
      box-shadow: 0 8px 32px rgba(0,0,0,.4);
      animation: toast-in .3s cubic-bezier(.34,1.56,.64,1) forwards;
    }
    .toast.hiding { animation: toast-out .3s ease forwards; }

    /* ===== FADE IN ===== */
    @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .fade-up { animation: fadeUp .5s cubic-bezier(.22,1,.36,1) both; }
    .delay-1 { animation-delay: .1s; }
    .delay-2 { animation-delay: .2s; }
    .delay-3 { animation-delay: .3s; }
    .delay-4 { animation-delay: .4s; }

    /* ===== SCROLLBAR ===== */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
  </style>
</head>
<body class="text-white">

<!-- ===================== ERROR PAGE ===================== -->
<div id="error-page" class="page hidden min-h-dvh flex flex-col items-center justify-center px-6 text-center">
  <div class="text-5xl mb-4">⚠️</div>
  <h2 class="heading text-xl font-bold text-white mb-2">ไม่พบข้อมูลร้านค้า</h2>
  <p class="text-white/50 text-sm leading-relaxed">ลิงก์ไม่ถูกต้องหรือหมดอายุแล้ว<br/>กรุณาสแกน QR Code ใหม่อีกครั้ง</p>
</div>

<!-- ===================== LOGIN PAGE ===================== -->
<div id="login-page" class="page hidden min-h-dvh flex flex-col px-5 py-8" style="max-width:420px;margin:auto;">

  <!-- Header -->
  <div class="fade-up mb-8 text-center pt-4">
    <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-white/8 border border-white/10 mb-4">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
        <path d="M12 2C6.477 2 2 6.477 2 12s4.477 10 10 10 10-4.477 10-10S17.523 2 12 2z" fill="rgba(245,200,66,.15)" stroke="#f5c842" stroke-width="1.5"/>
        <path d="M8 12l3 3 5-5" stroke="#f5c842" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h1 class="heading text-2xl font-bold text-white">สะสมแสตมป์</h1>
    <p class="text-white/40 text-sm mt-1">กรอกเบอร์โทรเพื่อเริ่มสะสมแต้ม</p>
  </div>

  <!-- Phone display -->
  <div class="fade-up delay-1 mb-6 text-center">
    <div class="inline-block bg-white/5 border border-white/10 rounded-2xl px-6 py-4 min-w-[200px]">
      <div id="phone-display" class="heading text-3xl font-bold tracking-widest text-white/20 mb-3 min-h-[40px]"></div>
      <div class="phone-dots" id="phone-dots">
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span>
      </div>
    </div>
  </div>

  <!-- Numpad -->
  <div class="fade-up delay-2 flex-1">
    <div class="grid grid-cols-3 gap-3 mb-3">
      <button class="numpad-btn" onclick="numpadPress('1')">1</button>
      <button class="numpad-btn" onclick="numpadPress('2')">2</button>
      <button class="numpad-btn" onclick="numpadPress('3')">3</button>
      <button class="numpad-btn" onclick="numpadPress('4')">4</button>
      <button class="numpad-btn" onclick="numpadPress('5')">5</button>
      <button class="numpad-btn" onclick="numpadPress('6')">6</button>
      <button class="numpad-btn" onclick="numpadPress('7')">7</button>
      <button class="numpad-btn" onclick="numpadPress('8')">8</button>
      <button class="numpad-btn" onclick="numpadPress('9')">9</button>
      <button class="numpad-btn delete" onclick="numpadDelete()">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <path d="M21 5H7l-4 7 4 7h14V5z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          <path d="M14 9l-4 6M10 9l4 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </button>
      <button class="numpad-btn" onclick="numpadPress('0')">0</button>
      <button class="numpad-btn confirm" onclick="numpadConfirm()" id="confirm-btn">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <path d="M5 12l5 5L19 7" stroke="#0f0f17" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>

    <p class="text-center text-white/25 text-xs mt-4 leading-relaxed">
      เบอร์โทรของคุณจะถูกเก็บเฉพาะในอุปกรณ์นี้<br/>เพื่อความสะดวกในการใช้งาน
    </p>
  </div>
</div>

<!-- ===================== MAIN CARD PAGE ===================== -->
<div id="card-page" class="page hidden min-h-dvh flex flex-col px-4 py-6" style="max-width:420px;margin:auto;">

  <!-- Top bar -->
  <div class="fade-up flex items-center justify-between mb-6">
    <div>
      <p class="text-white/40 text-xs mb-0.5">สวัสดีคุณ</p>
      <p class="heading font-bold text-base text-white" id="display-phone">—</p>
    </div>
    <button onclick="logout()" class="text-white/30 hover:text-white/60 transition-colors p-2 -mr-2">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
        <path d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>

  <!-- Reward progress text -->
  <div class="fade-up delay-1 mb-4 text-center">
    <p id="reward-text" class="text-white/60 text-sm leading-relaxed">
      <span class="shimmer inline-block w-40 h-4 rounded"></span>
    </p>
  </div>

  <!-- Stamp Card -->
  <div class="fade-up delay-2 stamp-card p-6 mb-4" id="stamp-card">
    <!-- Card header skeleton / real -->
    <div class="mb-5 pt-2">
      <div id="shop-name-display" class="heading font-bold text-xl text-white/90 shimmer h-6 w-32 rounded mb-1"></div>
      <div id="plan-badge" class="shimmer h-4 w-16 rounded"></div>
    </div>

    <!-- Stamp grid -->
    <div id="stamp-grid" class="grid grid-cols-5 gap-3 justify-items-center mb-2">
      <!-- Generated by JS -->
    </div>

    <!-- Points counter -->
    <div class="mt-5 pt-4 border-t border-white/10 flex items-center justify-between">
      <span class="text-white/40 text-xs">แต้มสะสม</span>
      <div class="flex items-baseline gap-1">
        <span id="points-count" class="heading font-bold text-2xl text-white">—</span>
        <span id="max-points-display" class="text-white/30 text-sm font-medium">/ —</span>
      </div>
    </div>
  </div>

  <!-- Action area -->
  <div class="fade-up delay-3" id="action-area">
    <!-- Filled by JS based on plan type -->
    <div class="shimmer h-16 rounded-2xl"></div>
  </div>

  <!-- Footer -->
  <div class="fade-up delay-4 text-center mt-6">
    <p class="text-white/15 text-xs">Powered by StampX</p>
  </div>
</div>

<!-- ===================== JAVASCRIPT ===================== -->
<script>
  // ============================================================
  //  CONFIG — เปลี่ยน URL นี้เป็น GAS Web App URL ของคุณ
  // ============================================================
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbzL2utsl4piExlOen4YowXKFGq-a0Ob3bF2azd-TwAvZvL3V2cOud8m_FKt7rdvL1yE/exec';

  // ===== STATE =====
  let shopId    = null;
  let userPhone = null;
  let phoneBuffer = '';
  let shopData  = null;   // { planType, maxPoints, cardColor, canRequestPoints, shopName? }
  let requesting = false;

  // ===== INIT =====
  function init() {
    const params = new URLSearchParams(window.location.search);
    shopId = params.get('shop');

    if (!shopId) {
      showPage('error-page'); return;
    }

    userPhone = localStorage.getItem('userPhone');

    if (!userPhone) {
      showPage('login-page');
    } else {
      showPage('card-page');
      document.getElementById('display-phone').textContent = formatPhone(userPhone);
      loadCardData();
    }
  }

  // ===== PAGE SWITCH =====
  function showPage(id) {
    ['error-page','login-page','card-page'].forEach(p => {
      document.getElementById(p).classList.toggle('hidden', p !== id);
    });
  }

  // ===== NUMPAD =====
  function numpadPress(digit) {
    if (phoneBuffer.length >= 10) return;
    phoneBuffer += digit;
    updatePhoneDisplay();
  }
  function numpadDelete() {
    phoneBuffer = phoneBuffer.slice(0, -1);
    updatePhoneDisplay();
  }
  function updatePhoneDisplay() {
    const el = document.getElementById('phone-display');
    const masked = phoneBuffer.padEnd(10, '·');
    el.textContent = masked.replace(/(.{3})(.{3})(.{4})/, '$1-$2-$3');
    el.style.color = phoneBuffer.length > 0 ? '#fff' : 'rgba(255,255,255,.2)';

    const dots = document.querySelectorAll('.phone-dots span');
    dots.forEach((d, i) => d.classList.toggle('filled', i < phoneBuffer.length));
  }
  function numpadConfirm() {
    if (phoneBuffer.length !== 10) {
      showToast('⚠️ กรุณากรอกเบอร์โทร 10 หลัก', '#ff6b6b');
      return;
    }
    userPhone = phoneBuffer;
    localStorage.setItem('userPhone', userPhone);
    document.getElementById('display-phone').textContent = formatPhone(userPhone);
    showPage('card-page');
    loadCardData();
  }

  // ===== LOAD CARD =====
  async function loadCardData() {
    try {
      const res = await fetch(GAS_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'check_points', shopId, phone: userPhone }),
        headers: { 'Content-Type': 'application/json' }
      });
      const data = await res.json();
      if (!data.success) throw new Error(data.error || 'ไม่สามารถโหลดข้อมูลได้');
      renderCard(data);
    } catch (err) {
      showToast('⚠️ ' + err.message, '#ff6b6b');
    }
  }

  // ===== RENDER CARD =====
  function renderCard(data) {
    const { shop, customer } = data;
    shopData = shop;

    const currentPoints = customer.currentPoints;
    const maxPoints     = shop.maxPoints;
    const remaining     = Math.max(0, maxPoints - currentPoints);

    // Card color
    // Card_Color in Sheets may be stored without '#' (e.g. 'FFC3BA') — add it if missing
    const rawColor = shop.cardColor || '';
    const cardColor = rawColor ? (rawColor.startsWith('#') ? rawColor : '#' + rawColor) : '#1a1a2e';
    document.documentElement.style.setProperty('--card-color', cardColor);

    // Reward text
    const rewardEl = document.getElementById('reward-text');
    if (remaining === 0) {
      rewardEl.innerHTML = '🎉 <span class="text-white font-semibold">ครบแล้ว! แลกรางวัลได้เลย</span>';
    } else {
      rewardEl.innerHTML = `อีก <span class="text-white font-semibold">${remaining} แต้ม</span> แลกฟรีได้เลย!`;
    }

    // Shop name & plan badge
    const nameEl = document.getElementById('shop-name-display');
    nameEl.textContent = shop.name || shop.shopName || `ร้านค้า #${shopId}`;
    nameEl.className = 'heading font-bold text-xl text-white/90';

    const badgeEl = document.getElementById('plan-badge');
    const planColors = { S: 'bg-gray-500/30 text-gray-300', M: 'bg-blue-500/30 text-blue-300', L: 'bg-amber-500/30 text-amber-300' };
    badgeEl.className = `inline-block text-xs font-semibold px-2 py-0.5 rounded-full ${planColors[shop.planType] || 'bg-white/10 text-white/50'}`;
    badgeEl.textContent = `PLAN ${shop.planType}`;

    // Points counter
    document.getElementById('points-count').textContent = currentPoints;
    document.getElementById('max-points-display').textContent = `/ ${maxPoints}`;

    // Stamp grid
    renderStampGrid(currentPoints, maxPoints);

    // Action area
    renderActionArea(shop.canRequestPoints, shop.planType);
  }

  // ===== STAMP GRID =====
  function renderStampGrid(current, max) {
    const grid = document.getElementById('stamp-grid');
    grid.innerHTML = '';
    for (let i = 0; i < max; i++) {
      const slot = document.createElement('div');
      const filled = i < current;
      slot.className = `stamp-slot ${filled ? 'filled' : ''}`;

      if (filled) {
        slot.innerHTML = stampSVG();
      } else {
        slot.innerHTML = `<span class="text-white/15 text-xs font-medium" style="font-family:'Prompt',sans-serif;">${i+1}</span>`;
      }

      // Staggered entrance animation
      slot.style.opacity = '0';
      slot.style.transform = 'scale(.5)';
      slot.style.transition = `opacity .3s ease ${i * 40}ms, transform .4s cubic-bezier(.34,1.56,.64,1) ${i * 40}ms`;
      grid.appendChild(slot);

      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          slot.style.opacity = '1';
          slot.style.transform = filled ? 'scale(1.04)' : 'scale(1)';
        });
      });
    }
  }

  function stampSVG() {
    return `
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="12" r="10" fill="rgba(245,200,66,.2)" stroke="#f5c842" stroke-width="1.5"/>
        <path d="M12 6l1.6 3.4 3.6.5-2.6 2.6.6 3.7L12 14.5l-3.2 1.7.6-3.7L6.8 9.9l3.6-.5z"
          fill="#f5c842" stroke="#f5c842" stroke-width=".5" stroke-linejoin="round"/>
      </svg>`;
  }

  // ===== ACTION AREA =====
  function renderActionArea(canRequest, planType) {
    const area = document.getElementById('action-area');
    if (!canRequest) {
      // Plan S
      area.innerHTML = `
        <div class="flex items-start gap-3 bg-white/5 border border-white/8 rounded-2xl p-4">
          <span class="text-xl mt-0.5">📢</span>
          <p class="text-white/45 text-sm leading-relaxed">
            กรุณาแจ้งเบอร์โทรศัพท์กับพนักงานหน้าร้านเพื่อสะสมแสตมป์
          </p>
        </div>`;
    } else {
      // Plan M / L
      const rawBtn = shopData?.cardColor || '';
      const safeColor = rawBtn ? (rawBtn.startsWith('#') ? rawBtn : '#' + rawBtn) : '';
      const btnBg = safeColor ? lighten(safeColor) : '#f5c842';
      const ringBg   = btnBg + '55';
      area.innerHTML = `
        <div class="pulse-btn-wrap">
          <div class="pulse-ring" style="background:${ringBg};"></div>
          <button class="pulse-btn" id="request-btn"
            style="background:${btnBg};color:#0f0f17;"
            onclick="requestPoint()">
            ✦ กดขอรับแสตมป์
          </button>
        </div>
        <p class="text-center text-white/25 text-xs mt-3">แตะเพื่อส่งคำขอให้พนักงานอนุมัติ</p>`;
    }
  }

  // ===== REQUEST POINT =====
  async function requestPoint() {
    if (requesting) return;
    requesting = true;
    const btn = document.getElementById('request-btn');
    if (btn) { btn.textContent = '⏳ กำลังส่ง...'; btn.disabled = true; }

    try {
      const res = await fetch(GAS_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'request_point', shopId, phone: userPhone }),
        headers: { 'Content-Type': 'application/json' }
      });
      const data = await res.json();

      if (!data.success) {
        if (data.error === 'COOLDOWN') {
          showToast('⏱ กรุณารอสักครู่ก่อนกดใหม่', '#f59e0b');
        } else {
          showToast('⚠️ ' + (data.message || data.error), '#ff6b6b');
        }
      } else {
        showToast('✅ ส่งคำขอสำเร็จ รอพนักงานอนุมัติ', '#22c55e');
      }
    } catch (err) {
      showToast('⚠️ ส่งคำขอไม่สำเร็จ: ' + err.message, '#ff6b6b');
    } finally {
      requesting = false;
      if (btn) {
        btn.textContent = '✦ กดขอรับแสตมป์';
        btn.disabled = false;
      }
    }
  }

  // ===== LOGOUT =====
  function logout() {
    if (!confirm('ต้องการเปลี่ยนเบอร์โทรใช่ไหม?')) return;
    localStorage.removeItem('userPhone');
    userPhone = null;
    phoneBuffer = '';
    updatePhoneDisplay();
    showPage('login-page');
  }

  // ===== TOAST =====
  function showToast(msg, bg = '#333') {
    const existing = document.querySelector('.toast');
    if (existing) existing.remove();

    const t = document.createElement('div');
    t.className = 'toast';
    t.style.background = bg;
    t.style.color = '#fff';
    t.textContent = msg;
    document.body.appendChild(t);

    setTimeout(() => {
      t.classList.add('hiding');
      setTimeout(() => t.remove(), 300);
    }, 3000);
  }

  // ===== UTILS =====
  function formatPhone(phone) {
    return phone.replace(/(\d{3})(\d{3})(\d{4})/, '$1-$2-$3');
  }

  function lighten(hex) {
    // Simple: if color is very dark, return accent yellow; otherwise return as-is
    try {
      const r = parseInt(hex.slice(1,3),16);
      const g = parseInt(hex.slice(3,5),16);
      const b = parseInt(hex.slice(5,7),16);
      const luma = (0.299*r + 0.587*g + 0.114*b);
      return luma < 80 ? '#f5c842' : hex;
    } catch { return '#f5c842'; }
  }

  // ===== START =====
  document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
