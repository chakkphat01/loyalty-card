<!DOCTYPE html>
<html lang="th" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<title>StampX — Franchise Portal</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Syne:wght@700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#080810; --bg2:#0e0e1c; --surface:rgba(255,255,255,.04);
  --border:rgba(255,255,255,.08); --border2:rgba(255,255,255,.14);
  --text:#f0f0ff; --muted:rgba(240,240,255,.38); --faint:rgba(255,255,255,.05);
  --gold:#f5c842; --gold2:#ffdd77; --gold-glow:rgba(245,200,66,.18);
  --green:#22c55e; --red:#ef4444; --blue:#60a5fa;
  --card-shadow:0 8px 32px rgba(0,0,0,.45);
  --radius:20px;
}
*{-webkit-tap-highlight-color:transparent;box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'Space Grotesk','Sarabun',sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100dvh;overflow-x:hidden;
}

/* ── NOISE TEXTURE ── */
body::before{
  content:'';position:fixed;inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
  pointer-events:none;z-index:0;opacity:.6;
}
/* grid lines */
body::after{
  content:'';position:fixed;inset:0;
  background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
  background-size:40px 40px;pointer-events:none;z-index:0;
}

.page{position:relative;z-index:1;}
.hidden{display:none!important;}

/* ── TYPOGRAPHY ── */
.display{font-family:'Syne',sans-serif;font-weight:800;letter-spacing:-.03em;}
.mono{font-family:'IBM Plex Mono',monospace;}

/* ── GLOW ORBS ── */
.orb{
  position:fixed;border-radius:50%;filter:blur(80px);pointer-events:none;z-index:0;
  animation:orb-float 8s ease-in-out infinite;
}
.orb-1{width:400px;height:400px;background:radial-gradient(circle,rgba(245,200,66,.12),transparent 70%);top:-100px;right:-100px;animation-delay:0s;}
.orb-2{width:300px;height:300px;background:radial-gradient(circle,rgba(96,165,250,.08),transparent 70%);bottom:100px;left:-80px;animation-delay:-4s;}
@keyframes orb-float{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-30px) scale(1.05)}}

/* ── LOGIN PAGE ── */
.login-wrap{
  min-height:100dvh;display:flex;align-items:center;justify-content:center;
  padding:24px;
}
.login-card{
  width:100%;max-width:360px;
  background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.02));
  border:1px solid var(--border2);border-radius:28px;
  padding:36px 28px;
  backdrop-filter:blur(20px);
  box-shadow:0 24px 64px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.1);
}
.login-logo{
  width:56px;height:56px;border-radius:16px;margin:0 auto 20px;
  background:linear-gradient(135deg,rgba(245,200,66,.2),rgba(245,200,66,.05));
  border:1px solid rgba(245,200,66,.3);
  display:flex;align-items:center;justify-content:center;
}
.pw-input{
  width:100%;background:rgba(255,255,255,.06);
  border:1.5px solid var(--border);border-radius:14px;
  padding:14px 16px;font-size:1rem;font-family:'Space Grotesk',sans-serif;
  font-weight:500;color:var(--text);outline:none;
  transition:border-color .2s,box-shadow .2s;
  letter-spacing:.08em;
}
.pw-input:focus{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-glow);}
.pw-input::placeholder{color:var(--muted);letter-spacing:normal;}
.btn-login{
  width:100%;padding:14px;border-radius:14px;border:none;cursor:pointer;
  background:linear-gradient(135deg,var(--gold),#e6a800);
  color:#1a1000;font-family:'Syne',sans-serif;font-weight:700;font-size:1rem;
  letter-spacing:.02em;transition:transform .15s,box-shadow .15s;
  box-shadow:0 4px 20px rgba(245,200,66,.35);
}
.btn-login:hover{transform:translateY(-1px);box-shadow:0 8px 28px rgba(245,200,66,.45);}
.btn-login:active{transform:scale(.98);}
.btn-login:disabled{opacity:.5;cursor:not-allowed;transform:none;}
.login-err{
  background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.25);
  border-radius:10px;padding:10px 14px;font-size:.82rem;font-weight:600;
  color:#ef4444;text-align:center;margin-bottom:14px;
}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.shake{animation:shake .4s ease;}

/* ── DASHBOARD ── */
.dash-wrap{
  max-width:520px;margin:0 auto;
  padding:24px 18px 120px;
}
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:28px;
}
.badge{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--gold-glow);border:1px solid rgba(245,200,66,.25);
  border-radius:50px;padding:4px 12px 4px 8px;
  font-size:.75rem;font-weight:600;color:var(--gold);
}
.icon-btn{
  width:40px;height:40px;border-radius:12px;background:var(--faint);
  border:1px solid var(--border);color:var(--text);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  transition:background .15s,border-color .15s;font-size:.8rem;font-weight:700;
}
.icon-btn:hover{background:var(--border);border-color:var(--border2);}

/* ── SECTION LABEL ── */
.sec-label{
  font-size:.68rem;font-weight:700;letter-spacing:.12em;
  text-transform:uppercase;color:var(--muted);margin-bottom:12px;
  display:flex;align-items:center;gap:8px;
}
.sec-label::after{content:'';flex:1;height:1px;background:var(--border);}

/* ── STAT GRID ── */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:24px;}
.stat-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:18px 16px;
  position:relative;overflow:hidden;
}
.stat-card::before{
  content:'';position:absolute;inset:0;opacity:0;
  background:linear-gradient(135deg,var(--gold-glow),transparent);
  transition:opacity .3s;
}
.stat-card.gold::before{opacity:1;}
.stat-card.gold{border-color:rgba(245,200,66,.2);}
.stat-val{
  font-family:'Syne',sans-serif;font-size:1.9rem;font-weight:800;
  line-height:1;margin-bottom:6px;position:relative;
}
.stat-lbl{font-size:.73rem;color:var(--muted);font-weight:500;position:relative;}

/* ── TABS ── */
.tab-bar{
  display:flex;gap:4px;background:var(--faint);
  border:1px solid var(--border);border-radius:14px;padding:4px;
  margin-bottom:20px;
}
.tab-btn{
  flex:1;padding:9px 8px;border-radius:10px;border:none;cursor:pointer;
  font-family:'Space Grotesk',sans-serif;font-size:.78rem;font-weight:600;
  color:var(--muted);background:transparent;transition:all .2s;
}
.tab-btn.active{background:var(--surface);color:var(--text);box-shadow:var(--card-shadow);}

/* ── BRANCH CARD ── */
.branch-item{
  display:flex;align-items:center;gap:12px;
  padding:14px 16px;border-bottom:1px solid var(--border);
  cursor:pointer;transition:background .15s;
}
.branch-item:last-child{border-bottom:none;}
.branch-item:hover{background:var(--faint);}
.branch-rank{
  width:32px;height:32px;border-radius:10px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:1rem;
}
.branch-bar-wrap{background:rgba(255,255,255,.07);border-radius:99px;height:4px;overflow:hidden;margin-top:6px;}
.branch-bar-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width .8s cubic-bezier(.34,1.56,.64,1);}

/* ── TOP CUST ── */
.top-item{
  display:flex;align-items:center;gap:12px;
  padding:13px 16px;border-bottom:1px solid var(--border);
}
.top-item:last-child{border-bottom:none;}
.top-medal{font-size:1.15rem;width:28px;text-align:center;flex-shrink:0;}
.top-pts{
  margin-left:auto;font-family:'IBM Plex Mono',monospace;
  font-size:.9rem;font-weight:600;color:var(--gold);
}

/* ── SHARE MODAL ── */
.modal-backdrop{
  position:fixed;inset:0;background:rgba(0,0,0,.7);
  backdrop-filter:blur(8px);z-index:100;
  display:flex;align-items:flex-end;justify-content:center;padding:0 0 16px;
}
.modal-sheet{
  width:100%;max-width:520px;
  background:linear-gradient(160deg,#13131f,#0e0e18);
  border:1px solid var(--border2);border-radius:28px 28px 20px 20px;
  padding:24px 20px;
  box-shadow:0 -8px 48px rgba(0,0,0,.6);
  animation:slide-up .3s cubic-bezier(.34,1.56,.64,1);
}
@keyframes slide-up{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-handle{width:36px;height:4px;border-radius:99px;background:var(--border2);margin:0 auto 20px;}
.branch-share-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 14px;border-radius:14px;margin-bottom:8px;
  background:var(--faint);border:1px solid var(--border);
}
.copy-btn{
  font-size:.72rem;font-weight:700;padding:6px 12px;border-radius:9px;border:none;
  background:rgba(245,200,66,.15);color:var(--gold);cursor:pointer;
  transition:background .15s;white-space:nowrap;flex-shrink:0;
}
.copy-btn:hover{background:rgba(245,200,66,.25);}
.copy-btn.copied{background:rgba(34,197,94,.2);color:var(--green);}

/* ── TOAST ── */
#toast{
  position:fixed;bottom:28px;left:50%;
  transform:translateX(-50%) translateY(80px);
  padding:11px 20px;border-radius:12px;
  font-weight:600;font-size:.85rem;z-index:999;
  transition:transform .3s cubic-bezier(.34,1.56,.64,1),opacity .3s;
  opacity:0;pointer-events:none;white-space:nowrap;
  box-shadow:0 4px 20px rgba(0,0,0,.4);
}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1;}

/* ── LOADING SKELETON ── */
.skel{
  background:linear-gradient(90deg,var(--faint) 25%,rgba(255,255,255,.08) 50%,var(--faint) 75%);
  background-size:200% 100%;border-radius:8px;
  animation:skel-shimmer 1.5s infinite;
}
@keyframes skel-shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ── SCROLL ── */
::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:99px;}

/* ── ANIMATIONS ── */
@keyframes fade-up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.fu{animation:fade-up .4s ease both;}
.fu1{animation-delay:.06s}.fu2{animation-delay:.12s}.fu3{animation-delay:.18s}.fu4{animation-delay:.24s}
</style>
</head>
<body>

<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<!-- ══════════ LOGIN ══════════ -->
<div id="page-login" class="page hidden">
<div class="login-wrap">
<div class="login-card">
  <div class="login-logo">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
      <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" stroke="#f5c842" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M9 22V12h6v10" stroke="#f5c842" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
  <p class="text-center mb-1" style="font-size:.7rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)">STAMPX</p>
  <h1 class="display text-center mb-1" style="font-size:1.55rem">Franchise Portal</h1>
  <p class="text-center mb-6" style="font-size:.8rem;color:var(--muted)">สำหรับเจ้าของเครือแฟรนไชส์</p>

  <div id="login-err" class="login-err hidden"></div>

  <div class="mb-3" style="position:relative">

  <button class="btn-login" id="login-btn" onclick="doLogin()">เข้าสู่ระบบ</button>

  <p class="text-center mt-4" style="font-size:.73rem;color:var(--muted)">

</div>
</div>
</div>
<!-- ══════════ DASHBOARD ══════════ -->
<div id="page-dash" class="page hidden">
<div class="dash-wrap">

  <!-- Top bar -->
  <div class="topbar fu">
    <div>
      <div class="badge mb-1">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" fill="#f5c842"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4" stroke="#f5c842" stroke-width="2" stroke-linecap="round"/></svg>
        <span id="fr-id-badge">FRC001</span>
      </div>
      <h2 class="display" id="fr-name" style="font-size:1.3rem">—</h2>
    </div>
    <div style="display:flex;gap:8px">
      <button class="icon-btn" onclick="openShareModal()" title="แชร์ลิงก์สาขา">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="18" cy="5" r="3" stroke="currentColor" stroke-width="1.8"/><circle cx="6" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/><circle cx="18" cy="19" r="3" stroke="currentColor" stroke-width="1.8"/><path d="M8.59 13.51l6.83 3.98M15.41 6.51l-6.82 3.98" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <button class="icon-btn" id="theme-btn" onclick="toggleTheme()">🌙</button>
      <button class="icon-btn" onclick="doLogout()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>

  </div>

  <!-- Stats -->
  <div class="stat-grid fu fu1">

      <div class="stat-val" style="color:var(--gold)" id="s-points">—</div>
      <div class="stat-lbl">แต้มรวมทั้งเครือ</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" style="color:var(--green)" id="s-today">—</div>
      <div class="stat-lbl">สแตมป์วันนี้</div>

    <div class="stat-card">
      <div class="stat-val" id="s-customers">—</div>

      <div class="stat-lbl">สาขาทั้งหมด</div>

  <!-- Tabs -->
  <div class="tab-bar fu fu2">
    <button class="tab-btn active" id="tab-branch" onclick="switchTab('branch')">🏪 สาขา</button>
    <button class="tab-btn" id="tab-top" onclick="switchTab('top')">🏆 ลูกค้า Top</button>
  </div>

  <!-- PANE: สาขา -->
  <div id="pane-branch" class="fu fu3">
    <div class="sec-label">อันดับสาขา</div>
    <div id="branch-list" style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden">
      <div style="padding:32px;text-align:center">
        <div class="skel" style="height:14px;width:60%;margin:0 auto 10px"></div>
        <div class="skel" style="height:14px;width:40%;margin:0 auto"></div>
      </div>
    </div>
  </div>

  <!-- PANE: Top customers -->
  <div id="pane-top" class="hidden fu fu3">
    <div class="sec-label">ลูกค้า Top ทั้งเครือ</div>
    <div id="top-list" style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden">
      <div style="padding:32px;text-align:center">
        <div class="skel" style="height:14px;width:60%;margin:0 auto 10px"></div>
        <div class="skel" style="height:14px;width:40%;margin:0 auto"></div>
      </div>
    </div>
  </div>

</div><!-- /dash-wrap -->

<!-- FAB refresh -->
<div style="position:fixed;bottom:28px;right:20px;z-index:10">
  <button onclick="loadDash()" id="refresh-btn"
    style="width:52px;height:52px;border-radius:16px;border:none;cursor:pointer;
    background:linear-gradient(135deg,var(--gold),#e6a800);color:#1a1000;
    font-size:1.2rem;box-shadow:0 4px 20px rgba(245,200,66,.4);
    transition:transform .2s,box-shadow .2s;"
    onmouseover="this.style.transform='scale(1.08)'" onmouseout="this.style.transform='scale(1)'">

  </button>
</div>
</div>

<!-- ══ SHARE MODAL ══ -->
<div id="share-modal" class="modal-backdrop hidden" onclick="closeShareModal(event)">
<div class="modal-sheet" onclick="event.stopPropagation()">
  <div class="modal-handle"></div>
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px">

    คัดลอกลิงก์นี้ให้ลูกค้าของแต่ละสาขา เพื่อเข้าหน้าสะสมแต้ม
  </p>
  <div id="share-list"></div>
</div>
</div>

<div id="toast"></div>

<script>
// ════════════════════════════════════════
//  ★ แก้ไข 2 บรรทัดนี้
// ════════════════════════════════════════
const GAS_URL   = 'https://script.google.com/macros/s/AKfycby-5p7TDLgkMw8UIfs5DAjfQAnYgiDPFD0IYDI29qftVglxyKsOL9ORj8PdXMZ1N5yx/exec';
const BASE_URL  = 'https://yoursite.com'; // URL ที่ host ไฟล์ HTML ของคุณ

// ── STATE ──
let franchiseId = null, frPassword = null;
let dashData    = null;   // cache ข้อมูล dashboard
let currentTab  = 'branch';
const SLUG_KEY  = 31337;
const B62       = '0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ';

// ── SLUG encode ──
function encodeSlug(shopId) {
  let n = 0;
  for (let i = 0; i < shopId.length; i++) n = n * 128 + shopId.charCodeAt(i);
  n = n ^ SLUG_KEY; let s = '';
  do { s = B62[n % 62] + s; n = Math.floor(n / 62); } while (n > 0);
  return s.padStart(6, '0');
}

// ── THEME ──
function getTheme() { return localStorage.getItem('theme') || 'dark'; }
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  localStorage.setItem('theme', t);
  const btn = document.getElementById('theme-btn');
  if (btn) btn.textContent = t === 'dark' ? '🌙' : '☀️';
}
function toggleTheme() { applyTheme(getTheme() === 'dark' ? 'light' : 'dark'); }

// ── TOAST ──
function showToast(msg, color) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.background = color || 'rgba(30,30,50,.95)';
  t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2800);
}

// ── PAGE ──
function showPage(id) {
  ['page-login','page-dash'].forEach(p =>
    document.getElementById(p)?.classList.toggle('hidden', p !== id));
}

// ── TABS ──
function switchTab(tab) {
  currentTab = tab;
  ['branch','top'].forEach(t => {
    document.getElementById('tab-'+t)?.classList.toggle('active', t === tab);
    document.getElementById('pane-'+t)?.classList.toggle('hidden', t !== tab);
  });
}

// ── PW VISIBILITY ──
let pwVisible = false;
function togglePwVis() {
  pwVisible = !pwVisible;
  const inp = document.getElementById('pw-input');
  inp.type = pwVisible ? 'text' : 'password';
  document.getElementById('pw-eye').textContent = pwVisible ? '🙈' : '👁';
}

// ── LOGIN ──
async function doLogin() {
  const pw = document.getElementById('pw-input').value.trim();
  if (!pw) return;
  const btn = document.getElementById('login-btn');
  btn.disabled = true; btn.textContent = '⏳ กำลังตรวจสอบ...';
  try {
    const r = await apiPost({ action:'get_franchise_dash', franchiseId, password:pw });
    if (!r.success) {
      const errEl = document.getElementById('login-err');
      errEl.textContent = '❌ รหัสผ่านไม่ถูกต้อง';
      errEl.classList.remove('hidden');
      const card = document.querySelector('.login-card');
      card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
      setTimeout(() => errEl.classList.add('hidden'), 2500);
    } else {
      frPassword = pw;
      sessionStorage.setItem('frAuth_' + franchiseId, btoa(pw.split('').reverse().join('')));
      renderDash(r); showPage('page-dash');
    }
  } catch(e) {
    showToast('⚠️ เชื่อมต่อไม่ได้', '#ef4444');
  } finally {
    btn.disabled = false; btn.textContent = 'เข้าสู่ระบบ';
  }
}

function doLogout() {
  sessionStorage.removeItem('frAuth_' + franchiseId);
  frPassword = null;
  document.getElementById('pw-input').value = '';
  showPage('page-login');
}

// ── LOAD DASH ──
async function loadDash() {
  if (!frPassword) return;
  const btn = document.getElementById('refresh-btn');
  if (btn) { btn.style.transform = 'rotate(360deg)'; btn.style.transition = 'transform .5s'; }
  setTimeout(() => { if (btn) { btn.style.transition = ''; btn.style.transform = ''; } }, 600);
  try {
    const r = await apiPost({ action:'get_franchise_dash', franchiseId, password:frPassword });
    if (!r.success) { showToast('❌ โหลดไม่สำเร็จ', '#ef4444'); return; }
    renderDash(r);
  } catch(e) { showToast('⚠️ เชื่อมต่อไม่ได้', '#ef4444'); }
}

// ── RENDER ──
function renderDash(r) {
  dashData = r;
  document.getElementById('fr-name').textContent = r.franchise?.name || franchiseId;
  document.getElementById('fr-id-badge').textContent = franchiseId;
  document.getElementById('s-points').textContent    = (r.summary.totalPoints || 0).toLocaleString();
  document.getElementById('s-today').textContent     = (r.summary.todayStampsAll || 0).toLocaleString();
  document.getElementById('s-customers').textContent = (r.summary.totalCustomers || 0).toLocaleString();
  document.getElementById('s-branches').textContent  = (r.summary.totalBranches || 0);
  renderBranches(r.branches || []);
  renderTopCustomers(r.topCustomers || []);
}

function renderBranches(branches) {
  const sorted = [...branches].sort((a, b) => b.totalPoints - a.totalPoints);
  const maxPts = Math.max(1, sorted[0]?.totalPoints || 1);
  const medals = ['🥇','🥈','🥉'];
  const colors = ['rgba(245,200,66,.25)','rgba(200,200,220,.15)','rgba(205,127,50,.2)'];
  document.getElementById('branch-list').innerHTML = sorted.length
    ? sorted.map((b, i) => `
      <div class="branch-item">
        <div class="branch-rank" style="background:${colors[i]||'var(--faint)'}">
          ${medals[i] || `<span class="mono" style="font-size:.8rem;color:var(--muted)">${i+1}</span>`}
        </div>
        <div style="flex:1;min-width:0">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">
            <span style="font-weight:600;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px">${b.name || b.shopId}</span>
            <span class="mono" style="font-size:.9rem;font-weight:600;margin-left:8px;flex-shrink:0">${(b.totalPoints||0).toLocaleString()} <span style="color:var(--muted);font-weight:400;font-size:.75rem">แต้ม</span></span>
          </div>
          <div style="display:flex;align-items:center;gap:8px">
            <div class="branch-bar-wrap" style="flex:1"><div class="branch-bar-fill" style="width:${Math.round((b.totalPoints||0)/maxPts*100)}%"></div></div>
            <span style="font-size:.7rem;color:var(--muted);white-space:nowrap">👥${b.totalCustomers||0} · 📅${b.todayStamps||0}</span>
          </div>
        </div>
      </div>`).join('')
    : `<p style="text-align:center;padding:32px;color:var(--muted);font-size:.85rem">ยังไม่มีข้อมูลสาขา</p>`;
}

function renderTopCustomers(custs) {
  const medals = ['🥇','🥈','🥉'];
  document.getElementById('top-list').innerHTML = custs.length
    ? custs.map((c, i) => `
      <div class="top-item">
        <span class="top-medal">${medals[i] || (i+1)}</span>
        <span class="mono" style="font-size:.85rem">${c.phone}</span>
        <span class="top-pts">${(c.pts||0).toLocaleString()} แต้ม</span>
      </div>`).join('')
    : `<p style="text-align:center;padding:32px;color:var(--muted);font-size:.85rem">ยังไม่มีข้อมูล</p>`;
}

// ── SHARE MODAL ──
function openShareModal() {
  if (!dashData?.branches?.length) {
    showToast('ยังไม่มีข้อมูลสาขา', '#f59e0b'); return;
  }
  const list = document.getElementById('share-list');
  list.innerHTML = dashData.branches.map(b => {
    const slug = encodeSlug(b.shopId);
    const custUrl  = `${BASE_URL}/index.html?shop=${slug}`;
    const shopUrl  = `${BASE_URL}/shop.html?shop=${slug}`;
    return `
      <div style="margin-bottom:12px">
        <p style="font-size:.78rem;font-weight:700;margin-bottom:6px;color:var(--muted)">${b.name || b.shopId}</p>
        <div class="branch-share-row">
          <div style="min-width:0;flex:1">
            <p style="font-size:.68rem;color:var(--muted);margin-bottom:2px">🎯 หน้าลูกค้า</p>
            <p class="mono" style="font-size:.72rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${custUrl}</p>
          </div>
          <button class="copy-btn" onclick="copyLink(this,'${custUrl}')">คัดลอก</button>
        </div>
        <div class="branch-share-row">
          <div style="min-width:0;flex:1">
            <p style="font-size:.68rem;color:var(--muted);margin-bottom:2px">🏪 หน้าร้านค้า</p>
            <p class="mono" style="font-size:.72rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${shopUrl}</p>
          </div>
          <button class="copy-btn" onclick="copyLink(this,'${shopUrl}')">คัดลอก</button>
        </div>
      </div>`;
  }).join('<hr style="border:none;border-top:1px solid var(--border);margin:12px 0"/>');
  document.getElementById('share-modal').classList.remove('hidden');
}
function closeShareModal(e) {
  if (!e || e.target === document.getElementById('share-modal'))
    document.getElementById('share-modal').classList.add('hidden');
}
async function copyLink(btn, url) {
  try {
    await navigator.clipboard.writeText(url);
    btn.textContent = '✓ คัดลอกแล้ว'; btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'คัดลอก'; btn.classList.remove('copied'); }, 2000);
  } catch {
    showToast('คัดลอกไม่ได้ กรุณาคัดลอกเอง', '#f59e0b');
  }
}

// ── API POST (JSONP) ──
function apiPost(body) {
  return new Promise((resolve, reject) => {
    const cb = '__cb' + Date.now() + Math.floor(Math.random() * 9999);
    const s  = document.createElement('script');
    let done = false;
    const t  = setTimeout(() => { if (!done) { done = true; delete window[cb]; s.remove(); reject(new Error('Timeout')); } }, 15000);
    window[cb] = (d) => { if (!done) { done = true; clearTimeout(t); delete window[cb]; s.remove(); resolve(d); } };
    s.src = GAS_URL + '?callback=' + cb + '&data=' + encodeURIComponent(JSON.stringify({ ...body, _t: Date.now() }));
    document.head.appendChild(s);
  });
}

// ── INIT ──
async function init() {
  applyTheme(getTheme());
  const p = new URLSearchParams(window.location.search);
  franchiseId = p.get('fr') || p.get('franchise') || '';
  if (!franchiseId) {
    document.body.innerHTML = `<div style="min-height:100dvh;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;text-align:center;padding:24px">
      <div><p style="font-size:2rem;margin-bottom:12px">⚠️</p>
      <p style="font-size:1rem;font-weight:600">ไม่พบ Franchise ID</p>
      <p style="font-size:.85rem;color:#888;margin-top:8px">URL ต้องมี <code>?fr=FRC001</code></p></div></div>`;
    return;
  }
  document.getElementById('fr-id-display').textContent = franchiseId;
  const saved = sessionStorage.getItem('frAuth_' + franchiseId);
  if (saved) {
    try {
      frPassword = atob(saved).split('').reverse().join('');
      const r = await apiPost({ action:'get_franchise_dash', franchiseId, password:frPassword });
      if (r.success) { renderDash(r); showPage('page-dash'); return; }
    } catch { frPassword = null; }
  }
  showPage('page-login');
  setTimeout(() => document.getElementById('pw-input')?.focus(), 200);
}

init();
</script>
