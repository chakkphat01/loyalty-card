<!DOCTYPE html>
<html lang="th" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
  <title>StampX Franchise</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&family=Prompt:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet"/>
  <style>
    :root[data-theme="dark"] {
      --bg:#0f0f17; --surface:#1a1a2e; --border:rgba(255,255,255,.09);
      --text:#fff; --muted:rgba(255,255,255,.4); --faint:rgba(255,255,255,.07);
      --accent:#f5c842; --green:#22c55e; --red:#ef4444;
      --grid-line:rgba(255,255,255,.015); --scrollbar:rgba(255,255,255,.15);
    }
    :root[data-theme="light"] {
      --bg:#f5f3ef; --surface:#fff; --border:rgba(0,0,0,.08);
      --text:#1c1917; --muted:rgba(0,0,0,.4); --faint:rgba(0,0,0,.05);
      --accent:#e6a800; --green:#16a34a; --red:#dc2626;
      --grid-line:rgba(0,0,0,.03); --scrollbar:rgba(0,0,0,.15);
    }
    *{-webkit-tap-highlight-color:transparent;box-sizing:border-box;}
    body{font-family:'Sarabun',sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;overflow-x:hidden;transition:background .3s,color .3s;}
    h1,h2,.heading{font-family:'Prompt',sans-serif;}
    body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(var(--grid-line) 1px,transparent 1px),linear-gradient(90deg,var(--grid-line) 1px,transparent 1px);background-size:32px 32px;pointer-events:none;z-index:0;}
    .page{position:relative;z-index:1;}
    .hidden{display:none!important;}

    /* ── THEME BTN ── */
    .theme-btn{width:40px;height:40px;border-radius:12px;background:var(--faint);border:1px solid var(--border);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .2s;}

    /* ── STAT CARD ── */
    .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:16px 18px;text-align:center;}
    .stat-num{font-family:'Prompt',sans-serif;font-size:1.8rem;font-weight:800;line-height:1;}

    /* ── BRANCH CARD ── */
    .branch-card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:16px;}
    .branch-bar{background:var(--faint);border-radius:99px;height:6px;overflow:hidden;margin-top:10px;}
    .branch-fill{height:100%;border-radius:99px;background:var(--accent);transition:width .6s ease;}

    /* ── PIN ── */
    .pin-btn{background:var(--faint);border:1px solid var(--border);border-radius:14px;padding:16px;font-size:1.2rem;font-weight:700;color:var(--text);cursor:pointer;transition:background .15s,transform .1s;}
    .pin-btn:active{transform:scale(.95);background:var(--border);}
    .pin-dots{display:flex;gap:10px;justify-content:center;margin-bottom:20px;}
    .pin-dots span{width:12px;height:12px;border-radius:50%;border:2px solid var(--border);transition:background .2s,border-color .2s;}
    .pin-dots span.filled{background:var(--accent);border-color:var(--accent);}

    /* ── TOP LIST ── */
    .top-row{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--border);}
    .top-row:last-child{border-bottom:none;}

    /* ── TOAST ── */
    #toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(100px);padding:12px 22px;border-radius:14px;font-weight:700;font-size:.9rem;z-index:999;transition:transform .35s cubic-bezier(.34,1.56,.64,1),opacity .3s;opacity:0;pointer-events:none;white-space:nowrap;}
    #toast.show{transform:translateX(-50%) translateY(0);opacity:1;}

    /* ── SCROLLBAR ── */
    ::-webkit-scrollbar{width:4px;}
    ::-webkit-scrollbar-thumb{background:var(--scrollbar);border-radius:4px;}

    /* ── ANIMATIONS ── */
    @keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
    .fade-up{animation:fadeUp .45s ease both;}
    .d1{animation-delay:.05s}.d2{animation-delay:.1s}.d3{animation-delay:.15s}
  </style>
</head>
<body>

<!-- ══ LOGIN ══ -->
<div id="page-login" class="page hidden min-h-dvh flex flex-col px-5 py-8" style="max-width:400px;margin:auto">
  <div class="flex justify-end mb-4">
    <button class="theme-btn" onclick="toggleTheme()">🌙</button>
  </div>
  <div class="fade-up text-center mb-8">
    <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl mb-4" style="background:var(--faint);border:1px solid var(--border)">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
        <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M9 22V12h6v10" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h1 class="heading font-bold text-2xl">Franchise Portal</h1>
    <p class="text-sm mt-1" style="color:var(--muted)">สำหรับเจ้าของเครือแฟรนไชส์</p>
  </div>

  <div id="login-err" class="hidden text-center text-sm font-bold mb-3 py-2 px-4 rounded-xl" style="background:rgba(239,68,68,.1);color:#ef4444"></div>

  <div class="fade-up d1 text-center mb-4">
    <div class="pin-dots" id="pin-dots">
      <span></span><span></span><span></span><span></span><span></span><span></span>
    </div>
    <p class="text-xs" style="color:var(--muted)">รหัสผ่าน Franchise</p>
  </div>

  <div class="fade-up d2 grid grid-cols-3 gap-3">
    <button class="pin-btn" onclick="pinPress('1')">1</button>
    <button class="pin-btn" onclick="pinPress('2')">2</button>
    <button class="pin-btn" onclick="pinPress('3')">3</button>
    <button class="pin-btn" onclick="pinPress('4')">4</button>
    <button class="pin-btn" onclick="pinPress('5')">5</button>
    <button class="pin-btn" onclick="pinPress('6')">6</button>
    <button class="pin-btn" onclick="pinPress('7')">7</button>
    <button class="pin-btn" onclick="pinPress('8')">8</button>
    <button class="pin-btn" onclick="pinPress('9')">9</button>
    <button class="pin-btn" onclick="pinClear()" style="color:var(--muted)">C</button>
    <button class="pin-btn" onclick="pinPress('0')">0</button>
    <button class="pin-btn" onclick="pinDelete()">⌫</button>
  </div>
</div>

<!-- ══ DASHBOARD ══ -->
<div id="page-dash" class="page hidden px-5 py-6 pb-24" style="max-width:480px;margin:auto">

  <!-- Top bar -->
  <div class="fade-up flex items-center justify-between mb-5">
    <div>
      <p class="text-xs" style="color:var(--muted)">แฟรนไชส์</p>
      <p class="heading font-bold text-lg" id="fr-name">—</p>
    </div>
    <div class="flex gap-2">
      <button class="theme-btn" onclick="toggleTheme()">🌙</button>
      <button class="theme-btn" onclick="confirmLogout()" style="font-size:1.1rem" title="ออกจากระบบ">
        🚪
      </button>
    </div>
  </div>

  <!-- Summary cards -->
  <div class="fade-up d1 grid grid-cols-2 gap-3 mb-5">
    <div class="stat-card">
      <p class="text-xs mb-2" style="color:var(--muted)">สาขาทั้งหมด</p>
      <p class="stat-num" id="stat-branches">—</p>
    </div>
    <div class="stat-card">
      <p class="text-xs mb-2" style="color:var(--muted)">ลูกค้าทั้งเครือ</p>
      <p class="stat-num" id="stat-customers">—</p>
    </div>
    <div class="stat-card">
      <p class="text-xs mb-2" style="color:var(--muted)">แต้มรวมทั้งเครือ</p>
      <p class="stat-num" style="color:var(--accent)" id="stat-points">—</p>
    </div>
    <div class="stat-card">
      <p class="text-xs mb-2" style="color:var(--muted)">สแตมป์วันนี้</p>
      <p class="stat-num" style="color:var(--green)" id="stat-today">—</p>
    </div>
  </div>

  <!-- Branch ranking -->
  <div class="fade-up d2 mb-5">
    <p class="text-xs font-bold tracking-widest uppercase mb-3" style="color:var(--muted)">🏪 อันดับสาขา (แต้มสะสม)</p>
    <div id="branch-list" style="background:var(--surface);border:1px solid var(--border);border-radius:18px;overflow:hidden;padding:8px">
      <p class="text-center py-6 text-sm" style="color:var(--muted)">⏳ กำลังโหลด...</p>
    </div>
  </div>

  <!-- Top customers -->
  <div class="fade-up d3">
    <p class="text-xs font-bold tracking-widest uppercase mb-3" style="color:var(--muted)">🏆 ลูกค้า Top ของเครือ</p>
    <div id="top-customers" style="background:var(--surface);border:1px solid var(--border);border-radius:18px;overflow:hidden;padding:8px">
      <p class="text-center py-6 text-sm" style="color:var(--muted)">⏳ กำลังโหลด...</p>
    </div>
  </div>

  <!-- Refresh -->
  <div class="fixed bottom-6 left-0 right-0 flex justify-center" style="max-width:480px;margin:auto">
    <button onclick="loadDash()" style="background:var(--accent);color:#0f0f17;font-family:'Prompt',sans-serif;font-weight:700;font-size:.9rem;padding:12px 28px;border-radius:16px;border:none;cursor:pointer;box-shadow:0 4px 20px rgba(245,200,66,.3)">
      🔄 รีเฟรช
    </button>
  </div>
</div>

<div id="toast"></div>

<script>
// ════════════════════════════════════════════════
//  CONFIG — แก้ 2 บรรทัดนี้
// ════════════════════════════════════════════════
const GAS_URL      = 'https://script.google.com/macros/s/AKfycby-5p7TDLgkMw8UIfs5DAjfQAnYgiDPFD0IYDI29qftVglxyKsOL9ORj8PdXMZ1N5yx/exec';
// franchiseId อยู่ใน URL: franchise.html?fr=FRC001
// หรือ hardcode ถ้ามีแค่เครือเดียว

// ── STATE ──
let franchiseId = null, frPassword = null, pinBuf = '';
const MAX_PIN = 8; // ความยาว password สูงสุด

// ── THEME ──
function getTheme() { return localStorage.getItem('theme') || 'dark'; }
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  localStorage.setItem('theme', t);
  document.querySelectorAll('.theme-btn').forEach(b => b.textContent = t==='dark'?'🌙':'☀️');
}
function toggleTheme() { applyTheme(getTheme()==='dark'?'light':'dark'); }

// ── TOAST ──
function showToast(msg, color) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.background = color || '#333';
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}

// ── PAGE ──
function showPage(id) {
  ['page-login','page-dash'].forEach(p => {
    document.getElementById(p)?.classList.toggle('hidden', p !== id);
  });
}

// ── PIN LOGIN ──
function pinPress(d) {
  if (pinBuf.length >= MAX_PIN) return;
  pinBuf += d;
  updatePinDots();
  if (pinBuf.length >= 6) tryLogin(); // กด 6+ ตัว → ลอง login
}
function pinDelete() { pinBuf = pinBuf.slice(0,-1); updatePinDots(); }
function pinClear()  { pinBuf = ''; updatePinDots(); }
function updatePinDots() {
  document.querySelectorAll('#pin-dots span').forEach((s,i) => {
    s.classList.toggle('filled', i < pinBuf.length);
  });
}

async function tryLogin() {
  const pw = pinBuf; pinBuf = ''; updatePinDots();
  const r = await apiPost({ action:'get_franchise_dash', franchiseId, password:pw });
  if (!r.success) {
    document.getElementById('login-err').textContent = '❌ รหัสผ่านไม่ถูกต้อง';
    document.getElementById('login-err').classList.remove('hidden');
    setTimeout(() => document.getElementById('login-err').classList.add('hidden'), 2000);
    return;
  }
  frPassword = pw;
  sessionStorage.setItem('frAuth_'+franchiseId, btoa(pw.split('').reverse().join('')));
  renderDash(r);
  showPage('page-dash');
}

function confirmLogout() {
  if (confirm('คุณแน่ใจหรือไม่ว่าต้องการออกจากระบบ?')) {
    doLogout();
  }
}

function doLogout() {
  sessionStorage.removeItem('frAuth_'+franchiseId);
  frPassword = null; pinBuf = ''; updatePinDots();
  showPage('page-login');
}

// ── LOAD DASHBOARD ──
async function loadDash() {
  if (!frPassword) return;
  const r = await apiPost({ action:'get_franchise_dash', franchiseId, password:frPassword });
  if (!r.success) { showToast('❌ โหลดไม่สำเร็จ','#ef4444'); return; }
  renderDash(r);
}

function renderDash(r) {
  document.getElementById('fr-name').textContent = r.franchise?.name || franchiseId;
  document.getElementById('stat-branches').textContent  = r.summary.totalBranches;
  document.getElementById('stat-customers').textContent = r.summary.totalCustomers.toLocaleString();
  document.getElementById('stat-points').textContent    = r.summary.totalPoints.toLocaleString();
  document.getElementById('stat-today').textContent     = r.summary.todayStampsAll;

  // Branch ranking
  const maxPts = Math.max(1, ...r.branches.map(b => b.totalPoints));
  const medals = ['🥇','🥈','🥉'];
  const bList = [...r.branches].sort((a,b) => b.totalPoints - a.totalPoints);
  document.getElementById('branch-list').innerHTML = bList.length
    ? bList.map((b,i) => `
      <div class="branch-card mb-2 last:mb-0">
        <div class="flex items-center justify-between mb-1">
          <div class="flex items-center gap-2">
            <span class="text-lg">${medals[i]||'#'+(i+1)}</span>
            <span class="font-bold text-sm">${b.name||b.shopId}</span>
          </div>
          <div class="text-right">
            <span class="font-mono font-bold">${b.totalPoints.toLocaleString()}</span>
            <span class="text-xs ml-1" style="color:var(--muted)">แต้ม</span>
          </div>
        </div>
        <div class="flex items-center gap-3">
          <div class="branch-bar flex-1"><div class="branch-fill" style="width:${Math.round(b.totalPoints/maxPts*100)}%"></div></div>
          <span class="text-xs" style="color:var(--muted)">👥${b.totalCustomers} · 📅${b.todayStamps}วันนี้</span>
        </div>
      </div>`).join('')
    : '<p class="text-center py-6 text-sm" style="color:var(--muted)">ยังไม่มีข้อมูลสาขา</p>';

  // Top customers
  const topMedals = ['🥇','🥈','🥉'];
  document.getElementById('top-customers').innerHTML = r.topCustomers?.length
    ? r.topCustomers.map((c,i) => `
      <div class="top-row">
        <span class="text-lg w-8 text-center">${topMedals[i]||i+1}</span>
        <span class="font-mono text-sm flex-1">${c.phone}</span>
        <span class="font-bold font-mono">${c.pts}</span>
        <span class="text-xs ml-1" style="color:var(--muted)">แต้ม</span>
      </div>`).join('')
    : '<p class="text-center py-6 text-sm" style="color:var(--muted)">ยังไม่มีข้อมูล</p>';
}

// ── API POST (JSONP) ──
function apiPost(body) {
  return new Promise((resolve, reject) => {
    const cbName = '__cb' + Date.now() + Math.floor(Math.random()*9999);
    const script = document.createElement('script');
    let done = false;
    const timer = setTimeout(() => {
      if (!done) { done = true; delete window[cbName]; script.remove(); reject(new Error('Timeout')); }
    }, 15000);
    window[cbName] = (data) => {
      if (!done) { done = true; clearTimeout(timer); delete window[cbName]; script.remove(); resolve(data); }
    };
    const encoded = encodeURIComponent(JSON.stringify({ ...body, _t: Date.now() }));
    script.src = GAS_URL + '?callback=' + cbName + '&data=' + encoded;
    document.head.appendChild(script);
  });
}

// ── INIT ──
async function init() {
  applyTheme(getTheme());
  const p = new URLSearchParams(window.location.search);
  franchiseId = p.get('fr') || p.get('franchise') || '';
  if (!franchiseId) {
    document.body.innerHTML = '<div style="text-align:center;padding:60px 20px;font-family:sans-serif"><p style="font-size:1.2rem">⚠️ ไม่พบ Franchise ID</p><p style="color:#888;margin-top:8px">URL ต้องมี ?fr=FRC001</p></div>';
    return;
  }
  // restore session
  const saved = sessionStorage.getItem('frAuth_'+franchiseId);
  if (saved) {
    try {
      frPassword = atob(saved).split('').reverse().join('');
      await loadDash();
      showPage('page-dash');
      return;
    } catch { frPassword = null; }
  }
  showPage('page-login');
}

init();
</script>
</body>
</html>
